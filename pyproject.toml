[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lalascaner"
version = "0.1.0"
description = "Мониторинг рынка ПК-комплектующих: lalafo.kg + Telegram, ИИ-классификация, бот с уведомлениями о выгодных ценах"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5",
    "aiogram>=3.20",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "beautifulsoup4>=4.13",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]

[project.scripts]
lalascaner = "lalascaner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
